name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawd-pet
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # 测试和代码检查不启动 Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clawd-pet/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
