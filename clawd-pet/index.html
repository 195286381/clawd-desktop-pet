<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Clawd</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none; }
  #c { position: absolute; left: 0; top: 0; will-change: transform; cursor: grab; }
  #c { transition: opacity .15s; }
  #c.ghost { opacity: .3; }   /* 光标路过时变半透明,点击穿透 */
  #c.dragging { cursor: grabbing; }

  /* 头顶电量标:剩余额度 ≤20% 时常驻 */
  #badge { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 999px; opacity: 0;
    font: 600 12px/18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; white-space: nowrap;
    pointer-events: none; transition: opacity .25s; box-shadow: 0 2px 8px rgba(60, 40, 20, .2); }
  #badge.show { opacity: 1; }
  #badge.lv2 { background: #FFF4E0; color: #B7791F; border: 1px solid #F0D3A0; }
  #badge.lv3 { background: #FDECEA; color: #C0392B; border: 1px solid #F3B8B0; animation: blink 1.2s ease-in-out infinite; }
  #badge.lv4 { background: #EDEBE8; color: #8A4B42; border: 1px solid #D5CFC8; }
  @keyframes blink { 50% { opacity: .45; } }

  /* 头顶气泡 */
  #bubble { position: absolute; left: 0; top: 0; max-width: 300px; padding: 10px 14px 9px;
    background: #FFFCF6; color: #3D3929; border: 1px solid #E8DFD0; border-radius: 14px;
    box-shadow: 0 6px 20px rgba(60, 40, 20, .18); pointer-events: none; opacity: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    transition: opacity .2s; --tail: 50%; white-space: nowrap; }
  #bubble.show { opacity: 1; }
  #bubble::after { content: ""; position: absolute; bottom: -7px; left: calc(var(--tail) - 7px);
    width: 12px; height: 12px; background: #FFFCF6; border-right: 1px solid #E8DFD0;
    border-bottom: 1px solid #E8DFD0; transform: rotate(45deg); }
  #bubble .title { font-weight: 600; color: #C15F3C; margin-bottom: 4px; }
  #bubble .row { display: grid; grid-template-columns: 76px auto 1fr; gap: 8px; align-items: baseline; }
  #bubble .row span { color: #8A8470; }
  #bubble .row b { font-variant-numeric: tabular-nums; }
  #bubble .row i { font-style: normal; color: #8A8470; font-size: 12px; text-align: right; }
  #bubble .models { margin-top: 4px; font-size: 12px; color: #6B6556; }
  #bubble .foot { margin-top: 4px; font-size: 11px; color: #A39E90; }
  #bubble .quota { margin: 2px 0 6px; }
  #bubble .qhead { display: grid; grid-template-columns: 76px auto 1fr; gap: 8px; align-items: baseline; }
  #bubble .qhead span { color: #8A8470; }
  #bubble .qhead b { color: #2F7D4F; font-variant-numeric: tabular-nums; }
  #bubble .qhead i { font-style: normal; color: #8A8470; font-size: 12px; text-align: right; }
  #bubble .qbar { height: 6px; margin-top: 3px; border-radius: 3px; background: #EFE8DC; overflow: hidden; }
  #bubble .qbar div { height: 100%; border-radius: 3px; background: #6BA77F; }
  #bubble .quota.mid .qhead b { color: #B7791F; }
  #bubble .quota.mid .qbar div { background: #E0A54A; }
  #bubble .quota.low .qhead b { color: #C0392B; }
  #bubble .quota.low .qbar div { background: #D9573F; }
  #bubble .sep { height: 1px; background: #EFE8DC; margin: 4px 0 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubble"></div>
<div id="badge"></div>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<script type="module" src="./pet.js"></script>
</body>
</html>
