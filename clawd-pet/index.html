<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Clawd</title>
<style>
  /* 像素字体:方舟像素字体 12px 简体中文版(SIL OFL 1.1,见 fonts/ark-pixel-OFL.txt)。
     点阵字只有在 12px 的整数倍下才清晰,所以气泡和血条里的字统一 12px、不加粗(加粗会把点阵糊掉),强调靠颜色。 */
  @font-face { font-family: "Ark Pixel"; src: url("fonts/ark-pixel-12px-proportional-zh_hans.otf.woff2") format("woff2"); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none; }
  #c { position: absolute; left: 0; top: 0; will-change: transform; cursor: grab; }
  #c { transition: opacity .15s; }
  #c.ghost { opacity: .3; }   /* 光标路过时变半透明,点击穿透(菜单「外观 → 鼠标经过时」可调) */
  #c.ghost[data-fade="light"] { opacity: .7; }
  #c.ghost[data-fade="none"] { opacity: 1; }
  #c.dragging { cursor: grabbing; }

  /* 头顶血条:和气泡同一套米白卡片风格,格子和百分比装在同一个胶囊里;贴边时竖过来 */
  #badge { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; opacity: 0;
    padding: 4px 6px; background: #FFFCF6; border: 1px solid #E8DFD0; border-radius: 8px;
    box-shadow: 0 3px 10px rgba(60, 40, 20, .14);
    font: 12px/12px "Ark Pixel", -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: none; white-space: nowrap;
    pointer-events: none; transition: opacity .25s; font-variant-numeric: tabular-nums; }
  #badge.show { opacity: 1; }
  :is(#badge, #dotstip .usage) .hp { display: flex; gap: 2px; }
  :is(#badge, #dotstip .usage) .hp i { width: 5px; height: 8px; border-radius: 1.5px; background: #EDE6DA; transition: background .4s; }
  :is(#badge, #dotstip .usage) b { color: #8A8470; font-weight: normal; }
  #badge.vert { flex-direction: column; gap: 4px; padding: 6px 4px; }
  #badge.vert .hp { flex-direction: column-reverse; }
  #badge.vert .hp i { width: 8px; height: 5px; }
  #badge.vert b { display: flex; flex-direction: column; align-items: center; line-height: 12px; }
  #badge.vert b span { display: block; }
  /* 五档配色取自油画颜料:绿土 → 土黄 → 焦赭 → 茜素红 → 戴维灰,饱和度统一压低,和陶土橘、米白气泡同一调子 */
  :is(#badge, #dotstip .usage).lv0 .hp i.on { background: #7FA383; }
  :is(#badge, #dotstip .usage).lv1 .hp i.on { background: #D4A24C; }
  :is(#badge, #dotstip .usage).lv2 .hp i.on { background: #C8703F; }  :is(#badge, #dotstip .usage).lv2 b { color: #9C4E24; }
  :is(#badge, #dotstip .usage).lv3 .hp i.on { background: #B8433F; }  :is(#badge, #dotstip .usage).lv3 b { color: #93302D; }
  :is(#badge, #dotstip .usage).lv3 .hp { animation: blink 1.2s ease-in-out infinite; }
  /* 悬停时圆环旁边显示本周百分比,颜色按本周额度的档位 */
  :is(#badge, #dotstip .usage) b.wk { color: #8A8470; }
  :is(#badge, #dotstip .usage) b.wk.lv2 { color: #9C4E24; }  :is(#badge, #dotstip .usage) b.wk.lv3 { color: #93302D; }  :is(#badge, #dotstip .usage) b.wk.lv4 { color: #6E6B67; }
  /* 本周额度小圆环:颜色同样按五档 */
  :is(#badge, #dotstip .usage) .ring { width: 15px; height: 15px; flex: none; }
  :is(#badge, #dotstip .usage) .ring circle { fill: none; stroke-width: 2.6; }
  :is(#badge, #dotstip .usage) .ring .track { stroke: #EDE6DA; }
  :is(#badge, #dotstip .usage) .ring .arc { stroke-linecap: round; transition: stroke-dasharray .4s; }
  :is(#badge, #dotstip .usage) .ring.lv0 .arc { stroke: #7FA383; }
  :is(#badge, #dotstip .usage) .ring.lv1 .arc { stroke: #D4A24C; }
  :is(#badge, #dotstip .usage) .ring.lv2 .arc { stroke: #C8703F; }
  :is(#badge, #dotstip .usage) .ring.lv3 .arc { stroke: #B8433F; }
  :is(#badge, #dotstip .usage) .ring.lv4 .arc { stroke: none; }
  :is(#badge, #dotstip .usage) .ring.lv4 .track { stroke: #D6D3CF; }
  :is(#badge, #dotstip .usage).lv4 b { color: #6E6B67; }
  @keyframes blink { 50% { opacity: .45; } }

  /* 头顶气泡 */
  #bubble { position: absolute; left: 0; top: 0; max-width: 300px; padding: 10px 14px 9px;
    background: #FFFCF6; color: #3D3929; border: 1px solid #E8DFD0; border-radius: 14px;
    box-shadow: 0 6px 20px rgba(60, 40, 20, .18); pointer-events: none; opacity: 0;
    font: 12px/18px "Ark Pixel", -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: none;
    transition: opacity .18s, scale .18s; scale: .94; transform-origin: var(--tail) 100%;
    --tail: 50%; white-space: nowrap; }
  #bubble.show { opacity: 1; scale: 1; }
  #bubble.yield { visibility: hidden; }   /* 给会话详情让开 */
  /* 弹出时从尖角处"啵"一下(用独立的 scale 属性,不影响定位用的 transform) */
  #bubble.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { from { scale: .7; opacity: 0; } to { scale: 1; opacity: 1; } }
  #bubble::after { content: ""; position: absolute; bottom: -7px; left: calc(var(--tail) - 7px);
    width: 12px; height: 12px; background: #FFFCF6; border-right: 1px solid #E8DFD0;
    border-bottom: 1px solid #E8DFD0; transform: rotate(45deg); }

  /* ---- 像素风对话框(对你说的话 say / 自言自语 chat / 用量面板 usage)----
     外框画在 .pxf 里:.pxs 用 clip-path 剪出"方框 + 阶梯尖角",再用 4 个方向的 drop-shadow 描出 3px 像素描边,
     四角自然是缺角的像素圆角;文字不在这层里,所以不会被描边。 */
  #bubble.say, #bubble.chat, #bubble.usage { background: none; border: none; box-shadow: none; border-radius: 0; isolation: isolate; }
  #bubble.say, #bubble.chat { padding: 7px 13px 8px; letter-spacing: 1px; }
  #bubble.usage { padding: 11px 15px 10px; }
  #bubble.say::after, #bubble.chat::after, #bubble.usage::after { display: none; }
  /* 用量面板里也换成像素风:方角进度条、像素虚线分隔 */
  #bubble.usage .qbar, #bubble.usage .qbar div { border-radius: 0; }
  #bubble.usage .qbar { height: 6px; box-shadow: inset 0 -2px 0 rgba(74, 63, 53, .08); }
  #bubble.usage .qbar div { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), inset 0 2px 0 rgba(255, 255, 255, .25); }
  :is(#bubble.usage, #bubble.say) .sep { height: 2px; background: repeating-linear-gradient(90deg, #E2D7C5 0 4px, transparent 4px 8px); margin: 6px 0 7px; }   /* 对你说的话几句合成一个框时,也用这条像素虚线隔开 */
  #bubble.usage .title { letter-spacing: .5px; }
  :is(#bubble, #dotstip) .pxf { position: absolute; inset: 0 0 -9px 0; z-index: -1; --ol: #4A3F35;
    filter: drop-shadow(3px 0 0 var(--ol)) drop-shadow(-3px 0 0 var(--ol)) drop-shadow(0 3px 0 var(--ol)) drop-shadow(0 -3px 0 var(--ol))
            drop-shadow(0 4px 0 rgba(74, 63, 53, .22)); }
  :is(#bubble, #dotstip) .pxs { position: absolute; inset: 0; background: #FFF8EC;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px),
      calc(var(--tail) + 6px) calc(100% - 9px), calc(var(--tail) + 6px) calc(100% - 6px),
      calc(var(--tail) + 3px) calc(100% - 6px), calc(var(--tail) + 3px) calc(100% - 3px),
      var(--tail) calc(100% - 3px), var(--tail) 100%,
      calc(var(--tail) - 6px) 100%, calc(var(--tail) - 6px) calc(100% - 9px), 0 calc(100% - 9px)); }
  #bubble.say { color: #3A322A; }
  /* 批准权限:命令原样显示,三个像素按钮 */
  #bubble.perm.show { pointer-events: auto; max-width: 340px; }
  #bubble.perm code { display: block; margin: 6px 0 0; padding: 4px 6px; background: #F1E6D3; color: #5B4A3A; font: inherit;
    white-space: pre-wrap; word-break: break-all; max-height: 84px; overflow: hidden; letter-spacing: 0; }
  /* 描边画在按钮里面:命令框、按钮、输入框的左右边都对齐;一排按钮平分整行,每行之间都隔 6px */
  #bubble.perm .btns { display: flex; gap: 6px; margin-top: 6px; }
  #bubble.perm .btns button { flex: 1; }
  #bubble.perm button { font: inherit; letter-spacing: inherit; padding: 5px 11px 6px; border: 0; border-radius: 0; cursor: pointer;
    background: #EDE2CF; color: #3A322A; box-shadow: inset 0 0 0 2px #4A3F35, inset 0 -4px 0 rgba(0, 0, 0, .12); }
  #bubble.perm button[data-d="allow"] { background: #7FA383; color: #FFF8EC; }
  #bubble.perm button[data-d="deny"] { background: #B8433F; color: #FFF8EC; }
  #bubble.perm button small { margin-left: 5px; font-size: inherit; opacity: .7; }
  /* 总是允许(下面一行是放行的规则)、写原因再拒绝的输入框:各占一整行 */
  #bubble.perm .always, #bubble.perm .why { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; text-align: left; }
  #bubble.perm .always small { display: block; margin-left: 0; color: #8A8470; opacity: 1; white-space: normal; word-break: break-all; }
  #bubble.perm button:hover { filter: brightness(1.08); }
  #bubble.perm button:active { translate: 0 1px; }
  /* 选择题:选项竖着排,最下面是自己写的输入框 */
  #bubble.perm .qn { font-style: normal; color: #A39E90; }
  #bubble.perm .q { margin-top: 4px; white-space: normal; }
  #bubble.perm .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  #bubble.perm .opts button { text-align: left; white-space: normal; }
  #bubble.perm .opts button small { display: block; margin-left: 0; color: #8A8470; opacity: 1; }
  #bubble.perm .opts button.on { background: #7FA383; color: #FFF8EC; }
  #bubble.perm .opts button.on small { color: #FFF8EC; opacity: .8; }
  #bubble.perm .other { font: inherit; letter-spacing: 0; padding: 3px 7px 4px; border: 0; border-radius: 0; outline: 0;
    background: #FFF8EC; color: #3A322A; box-shadow: inset 0 0 0 2px #C9BBA4; }
  #bubble.perm .other:focus { box-shadow: inset 0 0 0 2px #4A3F35; }
  #bubble.perm .other::placeholder { color: #A39E90; }
  #bubble.perm .more { display: block; margin-top: 6px; font-style: normal; color: #A39E90; }
  #bubble.say b { color: #B85C3A; }
  /* 自言自语:没有尖角,下面挂两颗像素小方块;描边更浅、字更柔和 */
  #bubble.chat { color: #6B6150; }
  #bubble.chat .pxf { --ol: #A8977F; }
  #bubble.chat .pxs { clip-path: inset(0 0 9px 0); }
  #bubble .pxf i { position: absolute; background: #FFF8EC; }
  #bubble.chat .pxf i.d1 { width: 6px; height: 6px; bottom: -6px; left: calc(var(--tail) - 3px); }
  #bubble.chat .pxf i.d2 { width: 3px; height: 3px; bottom: -18px; left: calc(var(--tail) + 3px); }
  #bubble.say .pxf i, #bubble.usage .pxf i { display: none; }
  /* 逐字出现 */
  #bubble .ch { display: inline-block; white-space: pre; opacity: 0; translate: 0 3px;
    animation: chIn .16s ease-out forwards; animation-delay: calc(var(--i) * 32ms + 120ms); }
  @keyframes chIn { to { opacity: 1; translate: 0 0; } }
  #bubble .title { color: #C15F3C; margin-bottom: 4px; }
  #bubble b { font-weight: normal; }
  #bubble .row { display: grid; grid-template-columns: 76px auto 1fr; gap: 8px; align-items: baseline; }
  :root[lang="en"] #bubble .row { grid-template-columns: 92px auto 1fr; }   /* 英文标签更长 */
  #bubble .row span { color: #8A8470; }
  #bubble .row b { font-variant-numeric: tabular-nums; }
  #bubble .row i { font-style: normal; color: #8A8470; text-align: right; }
  #bubble .models { margin-top: 4px; color: #6B6556; }
  #bubble .foot { margin-top: 4px; color: #A39E90; }
  /* 会话小螃蟹:不加框,直接趴在 Clawd 头顶 */
  #riders { position: absolute; left: 0; top: 0; display: flex; gap: 3px; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s;
    transform-origin: 50% 100%; }   /* 以脚底中点为轴跟着 Clawd 转 */
  #riders.show { opacity: 1; }
  #riders .rider { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #riders svg { display: block; shape-rendering: crispEdges; fill: currentColor; }
  :is(.rider, .pip, .ico).st-thinking { color: #C9C0B2; }
  :is(.rider, .pip, .ico).st-tool { color: #A5502F; }
  :is(.rider, .pip, .ico):is(.st-ask, .st-waiting, .st-error) { color: #B8433F; }
  :is(.rider, .pip, .ico).st-done { color: #7FA383; }
  /* 会话列表里的状态图标:像素小螃蟹 */
  .ico { display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .ico svg { display: block; shape-rendering: crispEdges; fill: currentColor; }
  .rider.st-tool { animation: crabBob 1.2s steps(2, jump-none) infinite; }
  .rider.st-ask, .rider.st-waiting { animation: crabHop .6s steps(2, jump-none) infinite; }
  /* 光标指着的那只(螃蟹或详情里的那一行):抬起来一蹦一蹦;光标变成小手 */
  #riders .rider.lift { transform: translateY(-3px); animation: crabHop .4s steps(2, jump-none) infinite; }
  body.picking, body.picking #c { cursor: pointer; }
  /* 头顶趴不下的会话:每个一颗像素点,颜色同样表示状态 */
  #riders .pips { display: flex; gap: 2px; margin: 0 0 1px 2px; }
  #riders .pip { display: block; width: 4px; height: 4px; background: currentColor; }
  @keyframes crabHop { 50% { translate: 0 -2px; } }
  @keyframes crabBob { 50% { translate: 0 -1px; } }
  #riders .rider { position: relative; }
  #riders .drop { position: absolute; right: -3px; bottom: 10px; fill: #6A9BCC; animation: crabDrip 1.1s steps(4, jump-none) infinite; }   /* 上下文快满:冒汗 */
  /* 子助手:派出它们的那只背上驮一只小螃蟹,数量写在它右边(不占位置,小螃蟹保持居中) */
  #riders .kids { position: relative; }
  #riders .kn { position: absolute; left: 100%; bottom: 0; margin-left: 2px; }
  @keyframes crabDrip { 0% { translate: 0 0; opacity: 1; } 100% { translate: 0 6px; opacity: 0; } }
  /* 压缩上下文时头顶的纸箱 */
  #packbox { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #packbox.show { opacity: 1; }
  #packbox svg { display: block; shape-rendering: crispEdges; }
  /* 小特效:彩纸、烟、跳下去爬走的小螃蟹 */
  #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #fx > i { position: absolute; left: 0; top: 0; display: block; width: 4px; height: 4px; }
  #fx > i.crab { width: auto; height: auto; }
  #fx svg { display: block; shape-rendering: crispEdges; fill: currentColor; }
  /* 悬停时的会话详情 */
  /* 和对话框同一套像素外框(.pxf),带小尖角;贴边 / 挂到下面时 .notail 去掉尖角 */
  #dotstip { position: absolute; left: 0; top: 0; display: none; padding: 8px 12px 7px; isolation: isolate; pointer-events: none; --tail: 50%;
    font: 12px/12px "Ark Pixel", -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: none; white-space: nowrap; color: #3A322A; }
  #dotstip .pxf i { display: none; }
  #dotstip.notail .pxs { clip-path: inset(0 0 9px 0); }
  #dotstip.show { display: grid; grid-template-columns: auto auto auto; gap: 0 10px; pointer-events: auto; }
  /* 每个会话一行,光标指着的那行高亮,点一下跳过去 */
  #dotstip > .row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; padding: 3px 4px; margin: 0 -4px; cursor: pointer; }
  #dotstip > .row.on { background: #F1E6D3; }
  #dotstip b { font-weight: normal; }
  #dotstip i { font-style: normal; color: #A39E90; text-align: right; }
  #dotstip .st-ask b, #dotstip .st-waiting b, #dotstip .st-error b { color: #B8433F; }
  #dotstip p { grid-column: 1 / -1; margin: 3px 0 0; color: #A39E90; }
  #dotstip p.note { color: #B8433F; }
  /* 会话详情和血条同时出现时合成一个框:用量在最上面一行,虚线隔开 */
  #dotstip > .usage { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 2px 0 8px; margin-bottom: 4px;
    background: repeating-linear-gradient(90deg, #E2D7C5 0 4px, transparent 4px 8px) bottom / 100% 2px no-repeat; }   /* 像素虚线,和用量面板一样 */
  #bubble .foot { white-space: normal; line-height: 16px; }
  #bubble .foot span { white-space: nowrap; }
  #bubble .stats { margin: 1px 0 3px; color: #6B6556; white-space: normal; line-height: 16px; }   /* 用量面板里今天 / 近 7 天的会话、测试、commit 次数 */
  #bubble .stats span { white-space: nowrap; }
  #bubble .quota { margin: 2px 0 6px; }
  #bubble .qhead { display: grid; grid-template-columns: 76px auto 1fr; gap: 8px; align-items: baseline; }
  #bubble .qhead span { color: #8A8470; }
  #bubble .qhead b { font-variant-numeric: tabular-nums; }
  #bubble .qhead i { font-style: normal; color: #8A8470; text-align: right; }
  #bubble .qbar { height: 6px; margin-top: 3px; border-radius: 3px; background: #EFE8DC; overflow: hidden; }
  #bubble .qbar div { height: 100%; border-radius: 3px; }
  #bubble .quota.lv0 .qhead b { color: #4E7A57; }  #bubble .quota.lv0 .qbar div { background: #7FA383; }
  #bubble .quota.lv1 .qhead b { color: #9A6E1C; }  #bubble .quota.lv1 .qbar div { background: #D4A24C; }
  #bubble .quota.lv2 .qhead b { color: #9C4E24; }  #bubble .quota.lv2 .qbar div { background: #C8703F; }
  #bubble .quota.lv3 .qhead b { color: #93302D; }  #bubble .quota.lv3 .qbar div { background: #B8433F; }
  #bubble .quota.lv4 .qhead b { color: #7A7672; }
  #bubble .quota.lv4 .qbar { background: repeating-linear-gradient(-45deg, #E4E1DD 0 5px, #EFEDEA 5px 10px); }
  /* 用量面板底部:Claude Code 会话列表 */
  #bubble .sub { color: #C15F3C; margin-bottom: 2px; }
  #bubble.usage.show { pointer-events: auto; }   /* 光标停在面板上时不收起,会话行可以点 */
  #bubble .sess { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: baseline; padding: 0 4px; margin: 0 -4px; cursor: pointer; }
  #bubble .sess:hover { background: #F1E6D3; }
  #bubble .sess span { color: #8A8470; overflow: hidden; text-overflow: ellipsis; }
  #bubble .sess b { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  #bubble .sess i { font-style: normal; color: #A39E90; text-align: right; }
  #bubble .sess.st-ask b, #bubble .sess.st-waiting b { color: #B85C3A; }
  #bubble .sess.st-error b { color: #B8433F; }
  #bubble .sess.st-done b { color: #6E8F72; }
  #bubble .eta { margin-top: 3px; color: #8A8470; }
  #bubble .eta.warn { color: #B8433F; }
  #bubble .eta.ok { color: #6E8F72; }
  #bubble .sep { height: 1px; background: #EFE8DC; margin: 4px 0 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="bubble"></div>
<div id="badge"></div>
<div id="riders"></div>
<div id="packbox"></div>
<div id="dotstip"></div>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<script type="module" src="./pet.js"></script>
</body>
</html>
