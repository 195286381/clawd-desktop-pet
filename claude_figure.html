<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 小人偶</title>
<style>
  :root {
    --bg: #F0EEE6;
    --fg: #3D3929;
    --muted: #8A8470;
    --btn-bg: #ffffffcc;
    --btn-border: #E3DED0;
    --accent: #D97757;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --fg: #EDEAE0; --muted: #A39E90;
      --btn-bg: #30302Ecc; --btn-border: #45443F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --fg: #EDEAE0; --muted: #A39E90;
    --btn-bg: #30302Ecc; --btn-border: #45443F;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  canvas { display: block; touch-action: none; }
  header { position: fixed; top: 20px; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  header p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .bar { position: fixed; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center;
    gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  .bar button { appearance: none; border: 1px solid var(--btn-border); background: var(--btn-bg);
    color: var(--fg); font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(8px); transition: transform .15s, border-color .15s; }
  .bar button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Claude 小人偶</h1>
  <p>拖动旋转 · 滚轮缩放 · 点它一下试试</p>
</header>
<div class="bar">
  <button data-act="wave" class="on">👋 打招呼</button>
  <button data-act="jump">⬆️ 跳一跳</button>
  <button data-act="spin">🌀 转圈圈</button>
  <button data-act="dance">💃 跳舞</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DEG = Math.PI / 180;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- 基础场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const applyBg = () => { scene.background = new THREE.Color(css('--bg')); };
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(1.6, 2.4, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 14;
controls.maxPolarAngle = 88 * DEG;
controls.update();

// 灯光
const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.radius = 6;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(2, 5, -5);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xfff8f0, 0xd9c8b4, 0.6));

// 地面(只接收阴影)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 材质 ----------
const physical = (color, o = {}) => new THREE.MeshPhysicalMaterial({
  color, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.35, sheen: 0.4, sheenColor: 0xffd2bd, ...o });
const M = {
  orange: physical(0xD97757),
  dark:   physical(0xC15F3C),
  cream:  physical(0xF7EDE0, { sheen: 0 }),
  eye:    new THREE.MeshStandardMaterial({ color: 0x1F1A17, roughness: 0.12 }),
  shine:  new THREE.MeshBasicMaterial({ color: 0xffffff }),
  blush:  new THREE.MeshStandardMaterial({ color: 0xF08A7A, roughness: 0.7, transparent: true, opacity: 0.85 }),
};

const SPHERE = new THREE.SphereGeometry(1, 48, 32);
function blob(parent, mat, pos, scale, rot = [0, 0, 0]) {
  const m = new THREE.Mesh(SPHERE, mat);
  m.position.set(...pos);
  m.scale.set(...scale);
  m.rotation.set(...rot);
  m.castShadow = true;
  parent.add(m);
  return m;
}

// ---------- 搭建人偶(和 Blender 版本同比例,Y 轴朝上) ----------
const root = new THREE.Group();          // 整体:跳跃、转圈
scene.add(root);
const bodyRig = new THREE.Group();        // 身体呼吸 / 跳舞摇摆
root.add(bodyRig);

const body = blob(bodyRig, M.orange, [0, 1.0, 0], [0.72, 0.8, 0.62]);

// 肚子上的星芒标志
const belly = new THREE.Group();
belly.position.set(0, 1.0, 0.6);
bodyRig.add(belly);
for (let i = 0; i < 8; i++) {
  const a = (i * 45 + 10) * DEG, r = 0.11;
  blob(belly, M.cream, [r * Math.sin(a), r * Math.cos(a), 0], [0.035, 0.11, 0.02], [0, 0, -a]);
}

// 腿 + 脚
for (const s of [-1, 1]) {
  blob(bodyRig, M.orange, [0.3 * s, 0.32, 0], [0.17, 0.3, 0.17]);
  blob(bodyRig, M.dark, [0.32 * s, 0.09, 0.1], [0.22, 0.1, 0.3]);
}

// 头(以脖子为轴心)
const NECK = 1.55;
const head = new THREE.Group();
head.position.y = NECK;
bodyRig.add(head);
const H = y => y - NECK;                  // 世界高度 -> 头部局部高度
blob(head, M.orange, [0, H(2.15), 0], [0.75, 0.72, 0.72]);

// 星芒光芒
const rays = new THREE.Group();
rays.position.set(0, H(2.15), -0.12);
head.add(rays);
const rayList = [];
const N_RAYS = 9;
for (let i = 0; i < N_RAYS; i++) {
  const a = (-108 + i * 216 / (N_RAYS - 1)) * DEG;
  const len = i % 2 === 0 ? 0.42 : 0.34;
  const pivot = new THREE.Group();        // 光芒根部为轴心,方便抖动
  pivot.rotation.z = -a;
  rays.add(pivot);
  const d = 0.72 + len * 0.75;
  const m = blob(pivot, i % 2 === 0 ? M.orange : M.dark, [0, d, 0], [0.15, len, 0.13]);
  rayList.push({ pivot, m, len, d, a });
}

// 五官
const eyes = [];
for (const s of [-1, 1]) {
  const eye = new THREE.Group();
  eye.position.set(0.24 * s, H(2.22), 0.66);
  eye.rotation.y = 18 * DEG * s;
  head.add(eye);
  blob(eye, M.eye, [0, 0, 0], [0.085, 0.13, 0.05]);
  blob(eye, M.shine, [0.03, 0.05, 0.045], [0.032, 0.032, 0.02]);
  blob(eye, M.shine, [-0.025, -0.06, 0.045], [0.016, 0.016, 0.012]);
  eyes.push(eye);
  blob(head, M.blush, [0.43 * s, H(2.02), 0.56], [0.11, 0.065, 0.03], [0, 35 * DEG * s, 0]);
}
const smileCurve = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-0.12, H(2.03), 0.705),
  new THREE.Vector3(0, H(1.9), 0.75),
  new THREE.Vector3(0.12, H(2.03), 0.705));
const smile = new THREE.Mesh(new THREE.TubeGeometry(smileCurve, 24, 0.022, 10), M.eye);
head.add(smile);
for (const x of [-0.12, 0.12]) blob(head, M.eye, [x, H(2.03), 0.705], [0.022, 0.022, 0.022]);

// 手臂(以肩膀为轴心)
function arm(shoulder, tilt, len, handOffset) {
  const g = new THREE.Group();
  g.position.set(...shoulder);
  bodyRig.add(g);
  const dir = [Math.sin(tilt), Math.cos(tilt)];
  blob(g, M.orange, [dir[0] * len, dir[1] * len, 0], [0.14, len, 0.14], [0, 0, -tilt]);
  blob(g, M.orange, [...handOffset, 0], [0.17, 0.17, 0.15]);
  return g;
}
const armR = arm([0.61, 1.14, 0.15], 48 * DEG, 0.42, [0.64, 0.6]);       // 举起的右手
const armL = arm([-0.6, 1.31, 0.12], (180 + 28) * DEG, 0.38, [-0.37, -0.67]); // 垂下的左手

// ---------- 交互 ----------
let mode = 'wave', actionStart = 0;
const buttons = document.querySelectorAll('.bar button');
function setMode(m) {
  mode = m; actionStart = clock.getElapsedTime();
  buttons.forEach(b => b.classList.toggle('on', b.dataset.act === m));
}
buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.act)));

const mouse = new THREE.Vector2();
addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
const ray = new THREE.Raycaster();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // 拖动不算点击
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (ray.intersectObject(root, true).length) setMode(['jump', 'spin', 'dance'][Math.floor(Math.random() * 3)]);
});

// ---------- 动画 ----------
const clock = new THREE.Clock();
const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
let nextBlink = 1.5;

function animate() {
  const t = clock.getElapsedTime();
  const p = t - actionStart;

  // 默认姿态
  let y = 0, spin = 0, squash = 1, sway = 0;
  let wave = Math.sin(t * 7) * 0.35;
  let armLz = Math.sin(t * 2) * 0.08;
  let raySpin = 0;

  if (mode === 'jump') {
    const d = 1.1, k = Math.min(p / d, 1);
    if (k < 0.15) squash = 1 - Math.sin(k / 0.15 * Math.PI) * 0.12;          // 起跳下蹲
    else if (k < 0.85) y = Math.sin((k - 0.15) / 0.7 * Math.PI) * 1.1;        // 腾空
    else squash = 1 - Math.sin((k - 0.85) / 0.15 * Math.PI) * 0.1;           // 落地缓冲
    wave = k > 0.15 && k < 0.85 ? -0.9 : wave;                                 // 空中举高手
    armLz = k > 0.15 && k < 0.85 ? -0.9 : armLz;
    if (k >= 1) setMode('wave');
  } else if (mode === 'spin') {
    const d = 1.4, k = Math.min(p / d, 1);
    spin = ease(k) * Math.PI * 2;
    y = Math.sin(k * Math.PI) * 0.35;
    raySpin = ease(k) * Math.PI * 2;
    armLz = -Math.sin(k * Math.PI) * 1.0;
    wave = -Math.sin(k * Math.PI) * 0.6;
    if (k >= 1) setMode('wave');
  } else if (mode === 'dance') {
    const beat = t * 5;
    sway = Math.sin(beat) * 0.14;
    y = Math.abs(Math.sin(beat)) * 0.12;
    wave = Math.sin(beat) * 0.6 - 0.2;
    armLz = Math.sin(beat + Math.PI) * 0.6 - 0.4;
    raySpin = Math.sin(beat * 0.5) * 0.25;
  }

  root.position.y = y;
  root.rotation.y = spin;
  bodyRig.rotation.z = sway;
  const breathe = 1 + Math.sin(t * 2.2) * 0.015;
  bodyRig.scale.set(1 / Math.sqrt(squash), squash * breathe, 1 / Math.sqrt(squash));

  armR.rotation.z = lerp(armR.rotation.z, wave, 0.25);
  armL.rotation.z = lerp(armL.rotation.z, armLz, 0.2);

  // 头:跟随鼠标 + 轻微摆动
  head.rotation.y = lerp(head.rotation.y, mouse.x * 0.45, 0.08);
  head.rotation.x = lerp(head.rotation.x, -mouse.y * 0.22, 0.08);
  head.rotation.z = Math.sin(t * 1.4) * 0.06 - sway * 0.6;

  // 光芒:呼吸 + 波浪
  rays.rotation.z = raySpin;
  rayList.forEach((r, i) => {
    const s = 1 + Math.sin(t * 3 + i * 0.8) * 0.09;
    r.m.scale.y = r.len * s;
    r.m.position.y = 0.72 + r.len * 0.75 * s;
    r.pivot.rotation.z = -r.a + Math.sin(t * 2.4 + i) * 0.05;
  });

  // 眨眼
  if (t > nextBlink) {
    const b = (t - nextBlink) / 0.16;
    const open = b < 1 ? Math.abs(1 - 2 * b) * 0.9 + 0.1 : 1;
    eyes.forEach(e => (e.scale.y = open));
    if (b >= 1) nextBlink = t + 2 + Math.random() * 3;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
