<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd 3D</title>
<style>
  :root {
    --bg: #F0EEE6;
    --fg: #3D3929;
    --muted: #8A8470;
    --btn-bg: #ffffffcc;
    --btn-border: #E3DED0;
    --accent: #DA7758;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --fg: #EDEAE0; --muted: #A39E90;
      --btn-bg: #30302Ecc; --btn-border: #45443F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --fg: #EDEAE0; --muted: #A39E90;
    --btn-bg: #30302Ecc; --btn-border: #45443F;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  canvas { display: block; touch-action: none; }
  header { position: fixed; top: 20px; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  header p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  pre.ascii { position: fixed; top: 16px; left: 16px; margin: 0; color: var(--accent); font-size: 14px;
    line-height: 1; pointer-events: none; opacity: .9; }
  .bar { position: fixed; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center;
    gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  .bar button { appearance: none; border: 1px solid var(--btn-border); background: var(--btn-bg);
    color: var(--fg); font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(8px); transition: transform .15s, border-color .15s; }
  .bar button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (max-width: 600px) { pre.ascii { display: none; } }
</style>
</head>
<body>
<pre class="ascii"> ▐▛███▛█
▝▜██████▀
 ▝▝   ▝▝</pre>
<header>
  <h1>Clawd</h1>
  <p>Claude Code 的小螃蟹 · 拖动旋转 · 点它一下试试</p>
</header>
<div class="bar">
  <button data-act="idle" class="on">😌 待机</button>
  <button data-act="wave">👋 打招呼</button>
  <button data-act="walk">🦀 横着走</button>
  <button data-act="jump">⬆️ 跳一跳</button>
  <button data-act="dance">💃 跳舞</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- 场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const applyBg = () => { scene.background = new THREE.Color(css('--bg')); };
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 3.0, 8.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
key.position.set(-4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
key.shadow.radius = 5;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
rim.position.set(3, 4, -6);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xfff8f0, 0xd9c8b4, 0.6));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.15 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Clawd ----------
// 依据 Claude Code 源码里的四分块字符画逐像素还原(默认姿态):
//    ▐▛███▛█        ...#############..
//   ▝▜██████▀       ...##.#######.##..   ← 第 1 行两个空像素就是眼睛
//    ▝▝   ▝▝        .#################   ← 第 2 行两侧各伸出 2 像素手臂
//                   ...#############..
//                   ...#.#.......#.#..   ← 四只脚贴着身体边缘
// 侧面 (edge) 视图 "▐██" 宽 5 像素 → 身体厚度 = 5 像素,两只脚分别在前后边缘。
// 终端里一个四分块像素宽:高 ≈ 1:2,所以 1 像素 = 宽 W、高 H = 2W。
const W = 0.2, H = 0.4;
const BODY_W = 13, DEPTH = 5;
const col = c => (c - (BODY_W - 1) / 2) * W;   // 身体列 0..12 的中心 x(手臂在 -2,-1 / 13,14 列)
const row = r => (4.5 - r) * H;                // 像素行 0..4 的中心 y(第 4 行是脚)
const D = DEPTH * W;

const orange = new THREE.MeshPhysicalMaterial({ color: 0xDA7758, roughness: 0.5, clearcoat: 0.25, clearcoatRoughness: 0.4 });
const dark = new THREE.MeshStandardMaterial({ color: 0x1B1714, roughness: 0.3 });

function box(parent, mat, [x, y, z], [w, h, d], r = 0.04) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

const root = new THREE.Group();   // 位移 / 转向
scene.add(root);
const torso = new THREE.Group();  // 整只 Clawd:弹跳 / 挤压 / 摇摆(原点在脚底)
root.add(torso);

box(torso, orange, [0, 3 * H, 0], [BODY_W * W, 4 * H, D], 0.06);

// 眼睛:原版是身体上的"空洞",这里用嵌进前表面的深色块表现
const EYE_COLS = [2, 10];
const eyes = EYE_COLS.map(c => {
  const g = new THREE.Group();
  g.position.set(col(c), row(1), D / 2);
  torso.add(g);
  const m = box(g, dark, [0, 0, -0.008], [W, H, 0.024], 0.01);
  m.castShadow = false;
  return { g, m, c };
});

// 手臂:一整块 2×1 像素的长条,以身体边缘为轴心。
// 源码 arms-up 帧里外侧像素上移一行,在 3D 里就是整条手臂绕肩膀往上抬(约 50°)。
// 手臂有一截(ARM_TUCK)藏在身体里,抬起或摆动时根部都不会露缝。
const ARM_TUCK = 0.42, ARM_RAISE = 0.9;
const arms = [-1, 1].map(s => {
  const g = new THREE.Group();
  g.position.set(s * BODY_W * W / 2, row(2), 0);
  torso.add(g);
  box(g, orange, [s * (2 * W - ARM_TUCK) / 2, 0, 0], [2 * W + ARM_TUCK, H, D * 0.6], 0.05);
  return { g, s };
});

// 四只脚:正面看在第 0、2、10、12 列;侧面看一前一后(源码侧面帧 "▝ ▝")。
// 往里收一点、并向上插进身体,避免和身体圆角之间露缝。pair 0 = 左边一对,1 = 右边一对
const LEG_Z = D / 2 - W / 2 - 0.04, LEG_TOP = 0.12;
const legs = [[0, -1], [2, 1], [10, 1], [12, -1]].map(([c, front]) => {
  const g = new THREE.Group();
  g.position.set(col(c), H, front * LEG_Z);          // 轴心在脚根(身体底面)
  torso.add(g);
  box(g, orange, [0, (LEG_TOP - H) / 2, 0], [W, H + LEG_TOP, W], 0.03);
  return { g, x0: col(c), pair: c < 6 ? 0 : 1 };
});

// ---------- 弹簧:所有动作都通过阻尼弹簧过渡,切换动作不会"瞬移",落地会有果冻般的回弹 ----------
class Spring {
  constructor(x, freq, zeta) { this.x = x; this.v = 0; this.w = 2 * Math.PI * freq; this.z = zeta; }
  step(target, dt) {
    const a = -this.w * this.w * (this.x - target) - 2 * this.z * this.w * this.v;
    this.v += a * dt; this.x += this.v * dt;
    return this.x;
  }
  kick(dv) { this.v += dv; }
}
const S = {
  lift:   new Spring(0, 4.0, 0.55),
  squash: new Spring(1, 3.2, 0.28),   // 低阻尼 → 落地后会抖几下
  lean:   new Spring(0, 2.2, 0.45),
  face:   new Spring(0, 1.4, 0.75),
  arm:    [new Spring(0, 3.5, 0.4), new Spring(0, 3.5, 0.4)],
  armRot: [new Spring(0, 3.0, 0.35), new Spring(0, 3.0, 0.35)],
  foot:   [0, 1, 2, 3].map(() => new Spring(0, 6, 0.6)),
  splay:  new Spring(0, 3, 0.5),
  eyeX:   new Spring(0, 5, 0.8),
  eyeY:   new Spring(0, 5, 0.8),
};

// ---------- 交互 ----------
let mode = 'idle', actionStart = 0, jumpSpin = 0, landed = false;
const buttons = document.querySelectorAll('.bar button');
function setMode(m) {
  mode = m; actionStart = clock.elapsedTime;
  landed = false;
  if (m === 'jump') jumpSpin = Math.random() < 0.5 ? 1 : 0;   // 一半概率空中转一圈
  buttons.forEach(b => b.classList.toggle('on', b.dataset.act === m));
}
buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.act)));

const mouse = new THREE.Vector2();
let mouseMovedAt = -10;
addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  mouseMovedAt = clock.elapsedTime;
});
const raycaster = new THREE.Raycaster();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  raycaster.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (raycaster.intersectObject(root, true).length) setMode('jump');
});

// ---------- 动画 ----------
const clock = new THREE.Clock();
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOut = x => 1 - (1 - x) * (1 - x);
const WALK_R = 1.4;
let walkT = 0, stepPhase = 0, prevX = 0;
let idleLook = 0, nextIdleLook = 2, idleTwitch = -1, nextTwitch = 5;
let nextBlink = 1.2, blinkStart = -1, blinkCount = 0, wink = false;

function animate() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;
  const p = t - actionStart;

  // 每个动作只给出"目标姿态",由弹簧负责平滑过渡
  let lift = 0, squash = 1, lean = 0, face = 0, spin = 0;
  let armUp = [0, 0], armRot = [0, 0], feet = [0, 0, 0, 0];
  let look = 0, lookUp = 0, liftDirect = null, eyeOpen = 1, splay = 0;
  const mouseLook = t - mouseMovedAt < 2.5 && Math.abs(mouse.x) > 0.3 ? Math.sign(mouse.x) : null;

  if (mode === 'idle') {
    // 呼吸 + 随机张望 + 偶尔抖一下手
    squash = 1 + Math.sin(t * 2.4) * 0.025;
    lean = Math.sin(t * 0.9) * 0.025;
    if (t > nextIdleLook) {
      idleLook = idleLook !== 0 ? 0 : (Math.random() < 0.5 ? -1 : 1);
      nextIdleLook = t + (idleLook ? 1.2 : 2.5) + Math.random() * 2;
    }
    look = mouseLook ?? idleLook;
    face = look * 0.12;                                  // 张望时身体也跟着微微转过去
    if (t > nextTwitch) { idleTwitch = t; nextTwitch = t + 4 + Math.random() * 4; }
    const tw = t - idleTwitch;
    if (tw < 0.5) { const s = Math.floor(idleTwitch) % 2; armUp[s] = 0.6; armRot[s] = Math.sin(tw * 30) * 0.15; }
  }

  else if (mode === 'wave') {
    // 先往反方向蓄力一下,再把右手举起来左右挥
    const k = clamp01(p / 0.25);
    armUp[1] = k < 1 ? 0 : 1;
    armRot[1] = k < 1 ? -0.2 : 0.25 + Math.sin(p * 11) * 0.35;
    lean = k < 1 ? 0.06 : -0.07;
    lift = Math.abs(Math.sin(p * 5.5)) * 0.04;
    squash = 1 - Math.abs(Math.cos(p * 5.5)) * 0.03;
    armRot[0] = Math.sin(p * 5.5) * 0.08;
    face = 0.15;
    look = mouseLook ?? 0;
    eyeOpen = 0.75 + 0.25 * Math.min(1, p * 2);             // 笑眯眯
    feet[0] = feet[1] = Math.max(0, Math.sin(p * 5.5)) * 0.06; // 左脚跟着打拍子
  }

  else if (mode === 'walk') {
    // 螃蟹横着走:两端自然减速转向;步频由实际移动速度决定,脚不会"打滑"
    walkT += dt;
    const x = Math.sin(walkT * 0.7) * WALK_R;
    const vx = (x - prevX) / Math.max(dt, 1e-4);
    prevX = x;
    root.position.x = x;
    stepPhase += Math.abs(vx) * dt * 7;
    const st = Math.sin(stepPhase);
    feet = [0, 1, 2, 3].map(i => Math.max(0, (legs[i].pair === 0 ? st : -st)) * 0.14);
    legs.forEach(l => { l.g.position.x = l.x0 + Math.sign(vx) * Math.max(0, l.pair === 0 ? st : -st) * 0.05; });
    lift = Math.abs(st) * 0.035 * Math.min(1, Math.abs(vx));
    squash = 1 - Math.abs(Math.cos(stepPhase)) * 0.025;
    lean = -vx * 0.05;                                         // 身体向前进方向倾
    look = Math.abs(vx) > 0.3 ? Math.sign(vx) : 0;             // 转向时眼睛回正
    armUp = [Math.max(0, st) * 0.35, Math.max(0, -st) * 0.35];
    armRot = [st * 0.12, -st * 0.12];
  }

  else if (mode === 'jump') {
    // 蓄力下蹲 → 拉长起跳 → 空中举手收脚(可能转一圈) → 落地压扁回弹
    const CROUCH = 0.28, AIR = 0.62, SETTLE = 0.6;
    if (p < CROUCH) {
      const k = easeOut(p / CROUCH);
      squash = 1 - 0.22 * k; lean = 0; eyeOpen = 1 - 0.5 * k;
      armRot = [-0.3 * k, -0.3 * k];                        // 手往下压
    } else if (p < CROUCH + AIR) {
      const k = (p - CROUCH) / AIR;
      liftDirect = 4 * 0.95 * k * (1 - k);                  // 抛物线
      squash = 1.15 - 0.2 * Math.min(1, k * 2);             // 起跳拉长,顶点恢复
      armUp = [1, 1]; armRot = [0.12, 0.12];
      splay = Math.sin(k * Math.PI) * 0.18;                 // 空中脚向外张开
      spin = jumpSpin * easeOut(k) * Math.PI * 2;
      look = 0; eyeOpen = 0.85;
    } else {
      if (!landed) { landed = true; S.squash.x = 0.72; S.squash.v = 0; S.lift.x = 0; S.lift.v = 0; }
      spin = jumpSpin * Math.PI * 2;
      armRot = [-0.12, -0.12];
      if (p > CROUCH + AIR + SETTLE) { spin = 0; jumpSpin = 0; setMode('idle'); }
    }
  }

  else if (mode === 'dance') {
    // 120 BPM:每拍一次小跳;两只手、身体倾斜、抬脚都按拍子左右交替;每 8 拍转一圈
    const beat = p * 2, n = Math.floor(beat), b = beat - n, side = n % 2 ? 1 : -1;
    lift = Math.sin(Math.PI * b) * 0.13;
    squash = b < 0.15 ? 0.9 : 1.03;
    lean = side * -0.13;
    armUp = side < 0 ? [1, 0.15] : [0.15, 1];
    armRot = side < 0 ? [0.3, -0.1] : [-0.1, 0.3];
    feet = [0, 1, 2, 3].map(i => ((legs[i].pair === 0) === (side < 0) ? 0.1 : 0));
    face = Math.sin(beat * Math.PI / 2) * 0.35;
    look = -side;
    if (n % 8 === 7) spin = easeOut(b) * Math.PI * 2;
  }

  if (mode !== 'walk') {
    root.position.x += (0 - root.position.x) * Math.min(1, dt * 3);
    prevX = root.position.x; walkT = Math.asin(Math.max(-1, Math.min(1, root.position.x / WALK_R))) / 0.7;
    legs.forEach(l => { l.g.position.x += (l.x0 - l.g.position.x) * Math.min(1, dt * 10); });
  }

  // ---- 弹簧求解并应用 ----
  if (liftDirect !== null) { S.lift.x = liftDirect; S.lift.v = 0; }
  const L = S.lift.step(liftDirect ?? lift, dt);
  const Q = S.squash.step(squash, dt);
  torso.position.y = Math.max(0, L);
  torso.scale.set(1 / Math.sqrt(Q), Q, 1 / Math.sqrt(Q));   // 体积守恒的挤压拉伸
  torso.rotation.z = S.lean.step(lean, dt);
  root.rotation.y = S.face.step(face, dt) + spin;

  arms.forEach((a, i) => {
    const up = S.arm[i].step(armUp[i], dt) * ARM_RAISE + S.armRot[i].step(armRot[i], dt);
    a.g.rotation.z = a.s * up;                                // > 0 = 手臂外端抬起
  });
  const sp = S.splay.step(splay, dt);
  legs.forEach((l, i) => {
    l.g.position.y = H + S.foot[i].step(feet[i], dt);
    l.g.rotation.z = (l.pair === 0 ? -1 : 1) * sp;          // 以脚根为轴向外张
  });

  // 眼睛:左右看时横移 1 像素并上移 1 行(和源码一致),由弹簧带出一点"甩"的感觉
  const ex = S.eyeX.step(look, dt), ey = S.eyeY.step(look !== 0 || lookUp ? 1 : 0, dt);
  // 眨眼:随机间隔,偶尔连眨两下,偶尔只眨右眼
  if (t > nextBlink && blinkStart < 0) { blinkStart = t; blinkCount = Math.random() < 0.3 ? 2 : 1; wink = Math.random() < 0.15; }
  let blink = 1;
  if (blinkStart >= 0) {
    const b = (t - blinkStart) / 0.16;
    blink = b < 1 ? Math.abs(1 - 2 * b) * 0.9 + 0.1 : 1;
    if (b >= 1.4) { if (--blinkCount > 0) blinkStart = t; else { blinkStart = -1; nextBlink = t + 2 + Math.random() * 3; } }
  }
  eyes.forEach((e, i) => {
    e.g.position.x = col(e.c) + ex * W;
    e.g.position.y = row(1) + ey * H;
    const s = Math.min(eyeOpen, i === 0 && wink ? 1 : blink);
    e.m.scale.y = s;
    e.m.position.y = -(1 - s) * H * 0.3;              // 闭眼时压成下方一条细线
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
